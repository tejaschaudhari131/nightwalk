services:
  - type: web
    name: nightwalk
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm ci --include=dev && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: VINEXT_TRUST_PROXY
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: nightwalk-db
          property: connectionString
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
databases:
  - name: nightwalk-db
    region: ohio
    plan: free
    databaseName: nightwalk
    postgresMajorVersion: '17'


